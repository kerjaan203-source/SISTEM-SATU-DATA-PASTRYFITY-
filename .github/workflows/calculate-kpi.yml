name: Evaluasi Bulanan & Auto-Lock Akun

on:
  schedule:
    - cron: '0 17 28-31 * *' 
  workflow_dispatch:

jobs:
  evaluate-and-reset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Database Repository
        uses: actions/checkout@v4
        with:
          repository: kerjaan203-source/db_pastryfity
          token: ${{ secrets.GH_TOKEN }}

      - name: Run Python Evaluation Logic
        run: |
          python3 -c "
          import json, os
          file_path = 'data/users.json'
          try:
              with open(file_path, 'r') as f:
                  users = json.load(f)
              changes = False
              for user in users:
                  if user.get('role') == 'employee' and user.get('status') == 'ACTIVE':
                      if user.get('grade_d_count', 0) >= 2:
                          user['status'] = 'INACTIVE_AUTO_RESIGNED'
                          changes = True
              if changes:
                  with open(file_path, 'w') as f:
                      json.dump(users, f, indent=2)
          except Exception as e:
              print('Error:', e)
          "

      - name: Commit Status Lock
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/users.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "System: Auto-lock akun 2x Grade D" && git push)
