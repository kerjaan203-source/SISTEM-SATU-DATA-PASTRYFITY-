<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manager - SATU SISTEM PASTRYFITY</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #EBF3FA; padding: 24px; }
    .glass { background: rgba(255, 255, 255, 0.9); border-radius: 16px; padding: 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .nav-btn { padding: 12px 24px; border-radius: 8px; font-weight: 600; cursor: pointer; text-align: center; font-size: 14px; }
    .active-nav { background: #2A6B9C; color: white; }
    .inactive-nav { background: #f8fafc; color: #475569; border: 1px solid #e2e8f0; }
    #loading-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.8); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
  </style>
</head>
<body>
  
  <div id="loading-overlay" style="display: none;">
    <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-[#2A6B9C] mb-4"></div>
    <h2 class="text-xl font-bold text-[#2A6B9C]" id="loading-text">Menyinkronkan...</h2>
  </div>

  <div class="max-w-7xl mx-auto space-y-6">
    <div class="glass flex justify-between items-center mb-4">
      <div>
        <h1 class="text-2xl font-bold text-[#2A6B9C]">Manager Dashboard</h1>
      </div>
      <div class="flex space-x-2">
        <button onclick="loadAllData()" class="bg-blue-100 text-blue-700 px-4 py-2 rounded-lg font-bold text-sm">🔄 Refresh Data</button>
        <a href="index.html" class="bg-red-50 text-red-600 px-5 py-2 rounded-lg font-bold text-sm">Logout</a>
      </div>
    </div>

    <div class="flex space-x-3 mb-6 overflow-x-auto pb-2">
      <div class="nav-btn active-nav whitespace-nowrap" onclick="switchMenu('menu-users')">Manajemen Karyawan</div>
    </div>

    <div id="menu-users" class="glass block grid grid-cols-1 xl:grid-cols-3 gap-8">
      <div class="xl:col-span-2 overflow-x-auto">
        <h2 class="text-lg font-bold mb-4">Database Master Karyawan</h2>
        <table class="w-full text-left text-sm border-collapse min-w-[700px]">
          <thead><tr class="bg-slate-100"><th class="p-3">Nama</th><th class="p-3">Posisi</th><th class="p-3">Tgl Masuk</th><th class="p-3 text-center">Aksi</th></tr></thead>
          <tbody id="user-table-body"></tbody>
        </table>
      </div>
      <div class="bg-slate-50 p-6 rounded-xl border border-slate-200">
        <h3 class="font-bold text-[#2A6B9C] mb-4">Tambah / Edit User</h3>
        <input type="hidden" id="edit-index" value="">
        <input type="text" id="edit-nama" placeholder="Nama Lengkap" class="w-full p-2 mb-3 rounded border text-sm">
        <label class="text-xs text-slate-500">Tgl Masuk</label><input type="date" id="edit-join" class="w-full p-2 mb-3 rounded border text-sm">
        <label class="text-xs text-slate-500">Posisi</label>
        <select id="edit-posisi" class="w-full p-2 mb-3 rounded border text-sm">
           <option value="Admin Toko">Admin Toko</option>
           <option value="Bakery">Bakery</option>
        </select>
        <input type="text" id="edit-pin" placeholder="PIN 6 Digit" maxlength="6" class="w-full p-2 mb-6 rounded border text-sm font-mono">
        <button onclick="saveUser()" class="w-full bg-[#2A6B9C] text-white py-2 rounded font-bold shadow">Simpan Data Karyawan</button>
      </div>
    </div>
  </div>

  <script>
    // =====================================================================
    // ⚙️ KONFIGURASI GITHUB API
    // =====================================================================
    const TOKEN_PART_1 = 'MASUKKAN_POTONGAN_1_DISINI'; 
    const TOKEN_PART_2 = 'MASUKKAN_POTONGAN_2_DISINI'; 
    const GITHUB_TOKEN = TOKEN_PART_1 + TOKEN_PART_2; 
    const REPO_OWNER = 'kerjaan203-source';         
    const REPO_NAME = 'SISTEM-SATU-DATA-PASTRYFITY-';       
    // =====================================================================

    let DB = { users: [] };
    const showLoading = (text) => { document.getElementById('loading-text').innerText = text; document.getElementById('loading-overlay').style.display = 'flex'; };
    const hideLoading = () => { document.getElementById('loading-overlay').style.display = 'none'; };

    async function fetchFromGitHub(fileName) {
      const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/data/${fileName}.json`, { headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Accept': 'application/vnd.github.v3+json' }, cache: 'no-store' });
      if(!res.ok) {
        if(res.status === 404) return { data: [], sha: null };
        throw new Error(`Gagal akses ${fileName}`);
      }
      const data = await res.json();
      return { data: JSON.parse(decodeURIComponent(escape(atob(data.content)))), sha: data.sha };
    }

    // 🔥 FUNGSI INI AKAN MELACAK ALASAN ERROR DARI GITHUB
    async function pushToGitHub(fileName, dataObj, commitMsg) {
      showLoading(`Menyimpan ${fileName} ke Server...`);
      try {
        const current = await fetchFromGitHub(fileName); 
        const updatedContent = btoa(unescape(encodeURIComponent(JSON.stringify(dataObj, null, 2))));
        
        const bodyData = { message: commitMsg, content: updatedContent };
        if(current.sha) bodyData.sha = current.sha;

        const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/data/${fileName}.json`, {
          method: 'PUT', 
          headers: { 
            'Authorization': `token ${GITHUB_TOKEN}`, 
            'Accept': 'application/vnd.github.v3+json', 
            'Content-Type': 'application/json' 
          },
          body: JSON.stringify(bodyData)
        });
        
        // JIKA GAGAL, BONGKAR PESAN ERROR DARI GITHUB
        if(!res.ok) {
           const errDetail = await res.json();
           throw new Error(`\nALASAN GITHUB: ${errDetail.message}\n(Kode Error: ${res.status})`);
        }
      } catch (err) {
        alert(`❌ GAGAL MENYIMPAN KE GITHUB!\n` + err.message + `\n\nJika Kode Error 404: Pastikan folder "data" sudah ada di repo.\nJika Kode Error 403/401: Izin Token Anda masih Read-Only atau Token kedaluwarsa.`);
      }
      hideLoading();
    }

    async function loadAllData() {
      showLoading("Menarik data dari GitHub...");
      try {
        const u = await fetchFromGitHub('users');
        DB.users = u.data;
        renderUserTable(); 
      } catch (e) {
        console.error(e);
      }
      hideLoading();
    }

    function renderUserTable() {
      const tbody = document.getElementById('user-table-body'); tbody.innerHTML = '';
      DB.users.forEach((u, i) => {
        if(u.role === 'manager' || u.role === 'owner') return; 
        tbody.innerHTML += `<tr class="border-b"><td class="p-3">${u.name}</td><td class="p-3">${u.division}</td><td class="p-3">${u.join_date||'-'}</td><td class="p-3 space-x-1 text-center"><button onclick="hapusUser(${i})" class="text-red-600 font-bold text-xs border px-2 py-1 rounded">Hapus</button></td></tr>`;
      });
    }

    async function saveUser() {
      const nama = document.getElementById('edit-nama').value;
      if(!nama) return alert('Nama tidak boleh kosong');
      
      const data = { 
        id: "U"+Date.now(), name: nama, 
        division: document.getElementById('edit-posisi').value, 
        join_date: document.getElementById('edit-join').value, 
        pin: document.getElementById('edit-pin').value, 
        status: "Aktif", role: "employee" 
      };
      
      DB.users.push(data);
      await pushToGitHub('users', DB.users, `Manager update user ${data.name}`);
      renderUserTable(); 
    }

    async function hapusUser(i) {
      if(confirm("Yakin hapus?")) { 
        DB.users.splice(i, 1); 
        await pushToGitHub('users', DB.users, `Manager hapus user`); 
        renderUserTable(); 
      }
    }

    window.onload = loadAllData;
    function switchMenu(x) {}
  </script>
</body>
</html>
