<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Executive Owner - SATU SISTEM PASTRYFITY</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #EBF3FA; padding: 24px; }
    .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(25px); border-radius: 24px; padding: 24px; box-shadow: 0 8px 30px rgba(0,0,0,0.04); }
  </style>
</head>
<body>
  <div class="max-w-7xl mx-auto space-y-6">
    <div class="glass flex justify-between items-center mb-2">
      <div>
        <h1 class="text-2xl font-bold text-[#2A6B9C]">Executive Dashboard</h1>
        <p class="text-sm text-slate-500">SATU SISTEM PASTRYFITY - Monitoring Performa Konsolidasi</p>
      </div>
      <a href="index.html" class="bg-red-50 text-red-600 px-5 py-2 rounded-xl font-bold text-sm hover:bg-red-100">Logout</a>
    </div>

    <!-- Stats Cards -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
      <div class="glass flex flex-col justify-center">
        <p class="text-xs font-semibold text-slate-500 uppercase">Rata-Rata Kinerja Tim</p>
        <p class="text-4xl font-bold text-[#2A6B9C] mt-2">88% <span class="text-sm text-green-500 font-semibold align-middle">Grade B</span></p>
      </div>
      <div class="glass flex flex-col justify-center">
        <p class="text-xs font-semibold text-slate-500 uppercase">Karyawan Grade D (Risiko)</p>
        <p class="text-4xl font-bold text-red-500 mt-2">1 <span class="text-sm text-slate-400 font-semibold align-middle">Orang</span></p>
      </div>
      <div class="glass flex flex-col justify-center">
        <p class="text-xs font-semibold text-slate-500 uppercase">Rata-Rata Food Cost</p>
        <p class="text-4xl font-bold text-orange-500 mt-2">32% <span class="text-sm text-slate-400 font-semibold align-middle">Batas 30%</span></p>
      </div>
      <div class="glass flex flex-col justify-center">
        <p class="text-xs font-semibold text-slate-500 uppercase">Total Waste MTD (Bulan Ini)</p>
        <p class="text-4xl font-bold text-[#2A6B9C] mt-2">4.5 <span class="text-sm text-slate-400 font-semibold align-middle">Kg</span></p>
      </div>
    </div>

    <!-- Charts -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <div class="glass">
        <h2 class="text-lg font-bold text-slate-800 mb-4">Tren Kinerja & Grade Tim (6 Bulan)</h2>
        <canvas id="trendChart" height="200"></canvas>
      </div>
      <div class="glass">
        <h2 class="text-lg font-bold text-slate-800 mb-4">Distribusi Waste per Divisi</h2>
        <canvas id="wasteChart" height="200"></canvas>
      </div>
    </div>
  </div>

  <script>
    const ctxTrend = document.getElementById('trendChart').getContext('2d');
    new Chart(ctxTrend, {
      type: 'line',
      data: {
        labels: ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun'],
        datasets: [{ label: 'Rata-rata Skor (%)', data: [82, 85, 84, 88, 87, 88], borderColor: '#2A6B9C', backgroundColor: 'rgba(42, 107, 156, 0.1)', fill: true, tension: 0.4 }]
      }
    });

    const ctxWaste = document.getElementById('wasteChart').getContext('2d');
    new Chart(ctxWaste, {
      type: 'bar',
      data: {
        labels: ['Bakery (Oven)', 'Head Chef (Dapur)', 'Barista (Bar)'],
        datasets: [{ label: 'Total Waste (Kg/Liter)', data: [2.1, 1.8, 0.6], backgroundColor: '#ef4444', borderRadius: 8 }]
      }
    });
  </script>
</body>
</html>
